[project]
name = "agentsecbench"
version = "0.1.0"
description = "Reproducible LLM and Agent security benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=5.0"]
training = ["peft>=0.20", "transformers>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agentsecbench = "agentsecbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsecbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
